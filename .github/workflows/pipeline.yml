name: Tourism Project Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch
  workflow_dispatch:  # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write

# The push cell commits files one at a time, and each commit triggers the workflow.
# This cancels any in-progress run when a newer one starts, so only the latest commit is processed.
concurrency:
  group: tourism-pipeline
  cancel-in-progress: true

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # Updated to resolve GitHub node deprecation warning
      - uses: actions/setup-python@v6 # Updated to resolve GitHub node deprecation warning
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v6 # Updated to resolve GitHub node deprecation warning
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # Updated to resolve GitHub node deprecation warning
      - uses: actions/setup-python@v6 # Updated to resolve GitHub node deprecation warning
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v6 # Updated to resolve GitHub node deprecation warning
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # Updated to resolve GitHub node deprecation warning
      - uses: actions/setup-python@v6 # Updated to resolve GitHub node deprecation warning
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v7 # Updated to resolve GitHub node deprecation warning
        with:
          name: data-splits
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5  # Wait for a moment to let the server starts
      - name: Model Building
        run: python tourism_project/model_building/train.py
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_model_v1.joblib   # path to the saved model file
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
